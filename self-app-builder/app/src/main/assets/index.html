<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Self App Builder</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#111827;color:#f9fafb} .wrap{padding:20px;max-width:720px;margin:auto} h1{font-size:28px;margin:8px 0 6px} p{color:#cbd5e1} .card{background:#1f2937;border-radius:18px;padding:18px;margin-top:18px;box-shadow:0 10px 30px #0004} label{display:block;margin:14px 0 6px;font-weight:700} input,select{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #374151;background:#0f172a;color:white;font-size:16px} .row{display:flex;gap:12px}.row>*{flex:1} button{width:100%;margin-top:20px;padding:15px;border:0;border-radius:14px;background:#fbbf24;color:#111827;font-weight:800;font-size:17px}.small{font-size:13px;color:#94a3b8;margin-top:12px}.badge{display:inline-block;background:#374151;padding:6px 10px;border-radius:999px;font-size:12px}</style>
</head>
<body><div class="wrap">
<span class="badge">SELF APP BUILDER v1</span>
<h1>Android App Builder</h1>
<p>Website oder Web-App konfigurieren und daraus ein Android-Projekt vorbereiten.</p>
<div class="card">
<label>App-Name</label><input id="name" value="Meine App">
<label>Website-URL</label><input id="url" placeholder="https://example.com">
<label>Paketname</label><input id="pkg" value="de.meine.app">
<div class="row"><div><label>Min SDK</label><select id="min"><option>24</option><option>26</option><option>28</option></select></div><div><label>Target SDK</label><select id="target"><option>35</option></select></div></div>
<label><input id="full" type="checkbox" checked style="width:auto"> Vollbild</label>
<label><input id="js" type="checkbox" checked style="width:auto"> JavaScript aktiv</label>
<button onclick="buildConfig()">Projekt-Konfiguration erzeugen</button>
<div id="out" class="small">Noch keine Konfiguration erzeugt.</div>
</div>
</div>
<script>
function buildConfig(){const cfg={appName:name.value,url:url.value,packageName:pkg.value,minSdk:+min.value,targetSdk:+target.value,fullscreen:full.checked,javascript:js.checked};out.textContent=JSON.stringify(cfg,null,2);}
</script></body></html>
