<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Silvana's Gaststätte</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light dark}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f1ea;color:#2e2a25}
    main{max-width:620px;padding:32px;text-align:center}
    h1{margin:0 0 12px;font-size:2rem}.card{background:#fff;padding:28px;border-radius:20px;box-shadow:0 8px 30px #0002}
    button{border:0;border-radius:999px;padding:12px 18px;font-size:1rem;background:#2e2a25;color:#fff;cursor:pointer}
    p{line-height:1.55}
  </style>
</head>
<body>
<main><div class="card">
  <h1>Silvana's Gaststätte</h1>
  <p>Die Online-Seite ist gerade nicht erreichbar. Sobald wieder Internet verfügbar ist, kann die aktuelle Restaurant-Seite neu geladen werden.</p>
  <button onclick="location.href='https://silvanas-gaststaette.de/'">Erneut laden</button>
</div></main>
</body>
</html>
