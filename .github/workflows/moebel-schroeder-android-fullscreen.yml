name: Build Extra Möbel Mobile APK

on:
  push:
    branches: [ moebel-schroeder-android-v2 ]
    paths:
      - 'android-fullscreen/**'
      - '.github/workflows/moebel-schroeder-android-fullscreen.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-fullscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Extra-Moebel.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Extra-Moebel-Mobile-APK
          path: android-fullscreen/Extra-Moebel.apk
