name: Build DIVINEKO Native APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DIVINEKO-Cat-Guard.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DIVINEKO-Cat-Guard-APK
          path: DIVINEKO-Cat-Guard.apk
          if-no-files-found: error
          retention-days: 30
