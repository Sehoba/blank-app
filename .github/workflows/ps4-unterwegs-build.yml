name: PS4 Unterwegs - Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PS4-Unterwegs/**'
      - '.github/workflows/ps4-unterwegs-build.yml'
  pull_request:
    paths:
      - 'PS4-Unterwegs/**'
      - '.github/workflows/ps4-unterwegs-build.yml'

concurrency:
  group: ps4-unterwegs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PS4-Unterwegs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Build optimized release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Create SHA-256 checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PS4-Unterwegs-release-apk
          path: |
            PS4-Unterwegs/app/build/outputs/apk/release/app-release.apk
            PS4-Unterwegs/app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
