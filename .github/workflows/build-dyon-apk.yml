name: Build DYON Sandbox APK

on:
  workflow_dispatch:
  push:
    branches: [ dyon-sandbox-mirror-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Bundle React runtime
        run: |
          mkdir -p app/src/main/assets/vendor
          curl -fsSL https://unpkg.com/react@19.0.0/umd/react.production.min.js -o app/src/main/assets/vendor/react.production.min.js
          curl -fsSL https://unpkg.com/react-dom@19.0.0/umd/react-dom.production.min.js -o app/src/main/assets/vendor/react-dom.production.min.js

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: DYON-Sandbox-Mirror-APK
          path: app/build/outputs/apk/debug/app-debug.apk
