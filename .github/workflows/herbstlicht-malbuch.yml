name: Herbstlicht Manga + Malbuch

on:
  workflow_dispatch:
  push:
    branches:
      - herbstlicht-malbuch
    paths:
      - 'herbstlicht-malbuch/**'
      - '.github/workflows/herbstlicht-malbuch.yml'

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image/PDF dependencies
        run: python -m pip install --upgrade pillow numpy opencv-python-headless

      - name: Build A4 book 1
        run: python herbstlicht-malbuch/build_book.py

      - name: Upload printable book 1
        uses: actions/upload-artifact@v4
        with:
          name: herbstlicht-buch1-a4
          path: |
            herbstlicht-malbuch/output/Herbstlicht_Manga_Buch1_A4_5_Doppelseiten.pdf
            herbstlicht-malbuch/output/Herbstlicht_Malbuch_Buch1_A4_5_Doppelseiten.pdf
            herbstlicht-malbuch/output/build-status.json
          if-no-files-found: error
