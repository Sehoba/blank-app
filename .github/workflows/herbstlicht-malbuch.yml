name: Herbstlicht Manga + Malbuch

on:
  workflow_dispatch:
  push:
    branches:
      - herbstlicht-malbuch
    paths:
      - 'herbstlicht-malbuch/**'
      - '.github/workflows/herbstlicht-malbuch.yml'

jobs:
  build-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Build A4 PDFs
        run: python herbstlicht-malbuch/build_book.py

      - name: Upload printable books
        uses: actions/upload-artifact@v4
        with:
          name: herbstlicht-druckdateien
          path: |
            herbstlicht-malbuch/output/Herbstlicht_Manga_A4.pdf
            herbstlicht-malbuch/output/Herbstlicht_Malbuch_A4.pdf
            herbstlicht-malbuch/output/build-status.json
          if-no-files-found: error
