name: Build RadioDE Android

on:
  push:
    branches: ["radiode-apk-build"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        shell: bash
        run: |
          set -euo pipefail
          cat radiode-payload/part-*.b64 | base64 -d > RadioDE-Mobile-source.zip
          echo "a67f8cc5b947a9957c2ec85d10c3d16ecb281046225ce0251441c30be2a82bfc  RadioDE-Mobile-source.zip" | sha256sum -c -
          mkdir android
          unzip -q RadioDE-Mobile-source.zip -d android
          test -f android/settings.gradle
          test -f android/app/src/main/assets/index.html
          test -s android/app/src/main/assets/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build APK and AAB
        working-directory: android
        run: gradle --no-daemon --stacktrace clean assembleDebug assembleRelease bundleRelease

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/RadioDE-Mobile-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/RadioDE-Mobile-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/RadioDE-Mobile-release.aab

      - name: Validate APK structure and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=artifacts/RadioDE-Mobile-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'classes.dex'
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'assets/index.html'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK" | tee artifacts/signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee artifacts/badging.txt
          grep -q "package: name='de.radiode.mobile'" artifacts/badging.txt
          grep -q "targetSdkVersion:'36'" artifacts/badging.txt

      - name: QA report
        shell: bash
        run: |
          {
            echo 'BUILD STATUS: PASS'
            echo 'APK: RadioDE-Mobile-release.apk'
            echo 'PACKAGE: de.radiode.mobile'
            echo 'VERSION: 1.0.0 / 1'
            echo 'MIN SDK: 24'
            echo 'TARGET SDK: 36'
            echo 'SIGNATURE: PASS (Testsignatur; vor dauerhaftem Play-Release durch privaten Upload-/Release-Key ersetzen)'
            echo 'WEBVIEW: PASS (WebViewAssetLoader-Container kompiliert)'
            echo 'JAVASCRIPT: PASS (aktiviert; gebündelte React-App verpackt)'
            echo 'INTERNET: PASS (nur INTERNET; Cleartext deaktiviert)'
            echo 'AUDIO: BUILD PASS / Laufzeit-Streams ohne echtes Android-Gerät nicht vollständig testbar'
            echo 'INSTALLATION: APK-Struktur und Signatur PASS / Installation auf physischem Gerät in CI nicht testbar'
          } > artifacts/QA-REPORT.txt

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: RadioDE-Mobile-Android
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
