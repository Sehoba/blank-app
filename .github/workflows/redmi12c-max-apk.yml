name: Build Redmi12C Max APK

on:
  push:
    branches: [ main ]
    paths:
      - 'redmi12c-max-app/**'
      - '.github/workflows/redmi12c-max-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: redmi12c-max-app
        run: gradle --no-daemon assembleDebug

      - name: Prepare artifact
        run: cp redmi12c-max-app/app/build/outputs/apk/debug/app-debug.apk Redmi12C-Max.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Redmi12C-Max-APK
          path: Redmi12C-Max.apk
          if-no-files-found: error
