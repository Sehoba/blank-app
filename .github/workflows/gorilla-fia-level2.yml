name: Build Gorilla & Fia Level 2 APK

on:
  push:
    branches: [gorilla-fia-level2-apk]
    paths:
      - '.github/workflows/gorilla-fia-level2.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web game and Android project
        working-directory: gorilla-fia
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android

      - name: Apply Android app identity, icon and fullscreen
        working-directory: gorilla-fia
        run: |
          sed -i 's/versionCode 1/versionCode 2/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "2.0"/' android/app/build.gradle
          mkdir -p android/app/src/main/res/drawable
          base64 -d app_icon.b64 > android/app/src/main/res/drawable/gorilla_fia_icon.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=s.replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/gorilla_fia_icon"')
          s=s.replace('android:roundIcon="@mipmap/ic_launcher_round"','android:roundIcon="@drawable/gorilla_fia_icon"')
          if 'android:screenOrientation=' not in s:
              s=s.replace('android:name=".MainActivity"','android:name=".MainActivity" android:screenOrientation="sensorLandscape" android:keepScreenOn="true"')
          p.write_text(s)
          PY
          cat > android/app/src/main/java/de/seba/gorillaflamingo/MainActivity.java <<'JAVA'
          package de.seba.gorillaflamingo;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              immersive();
            }
            @Override public void onWindowFocusChanged(boolean focus) {
              super.onWindowFocusChanged(focus);
              if (focus) immersive();
            }
            private void immersive() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY |
                View.SYSTEM_UI_FLAG_FULLSCREEN |
                View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN |
                View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_LAYOUT_STABLE);
            }
          }
          JAVA

      - name: Compile debug APK
        working-directory: gorilla-fia/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p apk-out
          cp gorilla-fia/android/app/build/outputs/apk/debug/app-debug.apk 'apk-out/Gorilla-Fia-v2-Level2-RPG.apk'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gorilla-Fia-v2-Level2-RPG-APK
          path: apk-out/Gorilla-Fia-v2-Level2-RPG.apk
          if-no-files-found: error
          retention-days: 30
